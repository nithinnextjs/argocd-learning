apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nithinnextjs/argocd-learning.git
    targetRevision: HEAD
    path: argocd-apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true